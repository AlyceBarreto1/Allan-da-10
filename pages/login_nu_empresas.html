<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insira seu CPF ou CNPJ</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <img src="../img/logo-mercado.png" alt="logo" width="150px">
    </header>
    
    <main>
        <div class="caixa">
            <h2>Insira CPF  ou CPNJ</h2>
            <p>O documento indica de quem será a conta. Ela pode ser sua ou de um negócio.</p>
            <input type="text" id="texto-caixa">
            <p id="textinho">Insira seu CPF com 11 números ou um CNPJ com 14 caracteres, sem pontos nem traços.</p>
            <button id="botao">Continuar</button>
        </div>
    </main>
</body>
</html>
